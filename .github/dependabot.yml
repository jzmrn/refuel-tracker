version: 2

updates:
  # --- Repository tooling (semantic-release / npm) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tooling"
    commit-message:
      prefix: "chore(tooling)"
      prefix-development: "chore(tooling)"
      include: "scope"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      tooling-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
