version: 2

updates:
  # --- Repository tooling (semantic-release / npm) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tooling"
    commit-message:
      prefix: "chore(tooling)"
      prefix-development: "chore(tooling)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      tooling:
        patterns:
          - "*"

  # --- GitHub Actions workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"

  # --- Frontend (Next.js / npm) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(frontend)"
      prefix-development: "chore(frontend-dev)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "chore(frontend)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-docker:
        patterns:
          - "*"

  # --- Backend (FastAPI / uv) ---
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(backend)"
      prefix-development: "chore(backend-dev)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "chore(backend)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # A Python minor bump is a runtime upgrade, not a routine update.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
    groups:
      backend-docker:
        patterns:
          - "*"

  # --- Analytics (Dagster / uv) ---
  - package-ecosystem: "uv"
    directory: "/analytics"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "analytics"
    commit-message:
      prefix: "chore(analytics)"
      prefix-development: "chore(analytics-dev)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      analytics:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/analytics"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "analytics"
    commit-message:
      prefix: "chore(analytics)"
    ignore:
      # Majors are reviewed and applied manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # A Python minor bump is a runtime upgrade, not a routine update.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
    groups:
      analytics-docker:
        patterns:
          - "*"
